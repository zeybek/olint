name: Release

# Opens and updates a release PR from the Conventional Commits on main and picks the next
# version from them. The PR updates CHANGELOG.md and VERSION in olint/doc.odin. Merging it
# tags the release, creates the GitHub release, and attaches an archive of the library
# folder and prebuilt CLI archives. See CONTRIBUTING.md.
#
# It runs only after CI has passed on a push to main, and only when that push is still the
# head of main: release-please reads main's current head, so a later push whose CI hasn't
# finished (or failed) must not be released on the strength of an earlier push's CI run.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check that the tested commit is still the head of main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head_sha="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          if [ "$head_sha" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on to $head_sha after CI tested $TESTED_SHA; the newer push's CI run releases it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: googleapis/release-please-action@v5
        id: release
        if: steps.head.outputs.current == 'true'
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  library:
    name: Library archive
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Package
        run: |
          mkdir -p stage/olint
          cp olint/*.odin LICENSE stage/olint/
          name="olint-$TAG-library"
          tar -czf "$name.tar.gz" -C stage olint
          (cd stage && zip -qr "../$name.zip" olint)
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Upload to the release
        run: gh release upload "$TAG" "$NAME.tar.gz" "$NAME.tar.gz.sha256" "$NAME.zip" "$NAME.zip.sha256" --clobber

  cli-binaries:
    name: CLI (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-amd64 }
          - { os: windows-latest, target: windows-amd64 }
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Build
        run: |
          mkdir -p dist
          exe=olint
          if [ "$RUNNER_OS" = "Windows" ]; then exe=olint.exe; fi
          odin build cmd/olint -out:"dist/$exe" -o:speed
          name="olint-$TAG-$TARGET"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a "../$name.zip" "$exe" >/dev/null)
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" -C dist "$exe"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload to the release
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
