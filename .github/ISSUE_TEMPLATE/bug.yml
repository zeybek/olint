name: Bug report
description: olint or its CLI doesn't do what the documentation says.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest Odin snippet or command that shows it
      render: odin
  - type: textarea
    id: odin-report
    attributes:
      label: Output of `odin report`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: olint version
      description: Printed by `olint version`, or the VERSION constant in olint/doc.odin.
    validations:
      required: true
